<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baskerville Lodge - Murder Mystery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* A storm-dark 1936 island house: slate and sea-black, brass deco lines, candle-warm text. */
  /* Layout: one reading column, the story above and the choices below it; the notebook slides in. */
  :root {
    --night: #0d1214; --panel: #151c1f; --line: #2a3438; --text: #e6dfd0; --dim: #9b968b;
    --brass: #c29a5b; --blood: #a3302c;
    --display: "Poiret One", "Futura", "Century Gothic", sans-serif;
    --body: "Spectral", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #1c2629 0%, var(--night) 60%) fixed, var(--night);
    color: var(--text); font-family: var(--body); font-size: 19px; line-height: 1.65;
    -webkit-tap-highlight-color: transparent;
  }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .35; }
  body.flash::after {
    content: ""; position: fixed; inset: 0; background: #cfe3ea; pointer-events: none;
    animation: flash .9s ease-out forwards;
  }
  @keyframes flash { 0% { opacity: .55; } 12% { opacity: 0; } 20% { opacity: .3; } 100% { opacity: 0; } }

  .bar {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 20px; background: rgba(13, 18, 20, .92); border-bottom: 1px solid var(--line);
  }
  .bar .house { font-family: var(--display); letter-spacing: .18em; text-transform: uppercase; font-size: 15px; color: var(--brass); }
  .bar .when { font-size: 15px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .pips { letter-spacing: .2em; color: var(--brass); }

  main { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  .kicker { font-family: var(--display); letter-spacing: .22em; text-transform: uppercase; font-size: 14px; color: var(--brass); margin: 0 0 6px; }
  h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0 0 22px; line-height: 1.15; }
  h2 { font-size: 40px; }
  h2::after { content: ""; display: block; width: 72px; height: 1px; background: var(--brass); margin-top: 16px; }
  .story p { margin: 0 0 1em; }
  .story p.ledger { font-style: italic; color: #d6cdb9; border-left: 2px solid var(--brass); padding-left: 16px; }
  .story p.dead { color: #e2b3ac; }
  .story p.clue { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; border-radius: 4px; }
  .story p.clue::before { content: "Into your notebook"; display: block; font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: 12px; color: var(--brass); margin-bottom: 4px; }

  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
  .choices button, .btn {
    font: inherit; font-size: 18px; text-align: left; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px; cursor: pointer;
    display: flex; gap: 12px; align-items: baseline; transition: border-color .15s, background .15s;
  }
  .choices button::before { content: "→"; color: var(--brass); }
  .choices button:hover { border-color: var(--brass); }
  .choices button small { display: block; color: var(--dim); font-size: 15px; margin-top: 2px; }
  .choices button.risky::before { content: "!"; color: var(--blood); font-weight: 600; }
  .choices button.back { background: transparent; color: var(--dim); }
  .choices button.back::before { content: "←"; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .notebook-btn { font: inherit; font-size: 15px; color: var(--text); background: transparent; border: 1px solid var(--brass); border-radius: 4px; padding: 6px 14px; cursor: pointer; }
  .drawer {
    position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); z-index: 3; background: var(--panel);
    border-left: 1px solid var(--line); padding: 24px 22px 40px; overflow-y: auto;
    transform: translateX(100%); transition: transform .25s ease; font-size: 17px;
  }
  .drawer.open { transform: none; box-shadow: -20px 0 50px rgba(0, 0, 0, .5); }
  .drawer h3 { font-family: var(--display); font-weight: 400; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); font-size: 16px; margin: 26px 0 10px; }
  .drawer .close { float: right; }
  .drawer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .drawer li { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .drawer .where { display: block; color: var(--dim); font-size: 14px; }
  .who { display: flex; justify-content: space-between; gap: 10px; }
  .chip { font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; white-space: nowrap; color: var(--dim); }
  .chip.warm { color: #d9c08f; border-color: #6b5a3a; }
  .chip.cold { color: #c99a95; border-color: #5a3532; }
  .chip.dead { color: var(--blood); border-color: var(--blood); }
  .empty { color: var(--dim); font-style: italic; }

  /* Title screen */
  .title { text-align: center; padding-top: 6vh; }
  .title .over { font-family: var(--display); letter-spacing: .4em; text-transform: uppercase; color: var(--brass); font-size: 15px; }
  .title h1 { font-size: clamp(46px, 9vw, 84px); margin: 14px 0 4px; letter-spacing: .04em; }
  .title .sub { font-family: var(--display); letter-spacing: .5em; text-transform: uppercase; font-size: 18px; color: var(--dim); }
  .title .rule { width: 1px; height: 70px; background: var(--brass); margin: 28px auto; }
  .title p { max-width: 52ch; margin: 0 auto 1em; color: #cfc8b8; }
  .title form { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 28px; }
  .title label { font-size: 16px; color: var(--dim); }
  .title input { font: inherit; font-size: 20px; text-align: center; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; width: min(320px, 100%); }
  .title .btn { justify-content: center; text-align: center; width: min(320px, 100%); border-color: var(--brass); }
  .title .note { font-size: 15px; color: var(--dim); margin-top: 30px; }

  @media (max-width: 520px) { body { font-size: 18px; } h2 { font-size: 32px; } }
  @media (prefers-reduced-motion: reduce) {
    #rain { display: none; }
    body.flash::after { animation: none; display: none; }
    .drawer { transition: none; }
  }
</style>
</head>

const CLUE_PLACES = ["hall", "study", "gunroom", "kitchen", "boathouse", "cliff", "chapel"];
const ACTIONS_PER_DAY = { 2: 3, 3: 3, 4: 2 };
const TRUST_WORDS = ["Hostile", "Wary", "Guarded", "Warm", "Trusts you", "Devoted"];

// ===== State =====

const SAVE_KEY = "baskerville-lodge-save";
let S = null;

// A random number from 0 up to 1. Uses the browser's secure generator where it can,
// because some viewers hand a page the same Math.random sequence every time it opens.
const rand = () => {
  try { return crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32; } catch (e) { return Math.random(); }
};
const pick = arr => arr[Math.floor(rand() * arr.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// The last few killers, so the next game picks someone else.
const RECENT_KEY = "baskerville-lodge-recent-killers";
function chooseKiller() {
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch (e) { /* not available */ }
  const fresh = SUSPECTS.filter(id => !recent.includes(id));
  const killer = pick(fresh.length ? fresh : SUSPECTS);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify([killer, ...recent].slice(0, 3))); } catch (e) { /* not available */ }
  return killer;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const alive = id => !S.dead.includes(id);
const aliveSuspects = () => SUSPECTS.filter(alive);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function newState(name) {
  const killer = chooseKiller();
  const trust = {};
  SUSPECTS.forEach(id => { trust[id] = 1; });
  return {
    name, killer, trust, awareness: 0, day: 1, actions: 0, dead: [], deaths: [],
    order: shuffle(SUSPECTS.filter(id => id !== killer)),
    searched: [], roomsSearched: [], talked: [], clues: [], notes: [],
    protected: null, page: null, crept: false,
  };
}

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* not available */ } }
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* not available */ } }

function addClue(key, text, where) {
  if (S.clues.some(c => c.key === key)) return false;
  S.clues.push({ key, text, where, day: S.day });
  return true;
}
function addNote(text) { if (!S.notes.includes(text)) S.notes.push(text); }
function trustUp(id, n) { S.trust[id] = Math.max(0, Math.min(5, S.trust[id] + n)); }

// ===== Pages =====
// A page is plain data: kicker, title, paragraphs, and choices that name an action.

function setPage(page) {
  S.page = page;
  save();
  render();
}
const P = (text, cls) => ({ text, cls });
const C = (label, action, arg, opts = {}) => ({ label, action, arg, ...opts });

function when() {
  if (S.day === 1) return "The first evening";
  return `Day ${S.day}`;
}

A.nightWatch = id => {

    S.protected = null;

  } else {
    S.protected = id;
    trustUp(id, 1);
    addNote(`${cap(G[id].name)} sat up with you on night ${S.day} and never left the room.`);

A.nightCreep = () => {

  nightPasses(first
    ? [P("You ease the door open and go along the corridor in your stockings, keeping to the wall where the boards don't creak."), P(K[S.killer].night, "clue"), P("You get back to your room without being seen. You think.")]

function nightPasses(paras) {
  // The killer strikes.
  let victim;
  if (S.day === 1) victim = "hollis";
  else victim = S.order.find(id => alive(id) && id !== S.protected);
  S.protected = null;
  const kicker = `${when()}, night`;
  if (victim) {
    S.dead.push(victim);
    S.deaths.push({ id: victim, day: S.day + 1 });
  }
  S.day += 1;
  S.actions = ACTIONS_PER_DAY[S.day];
  S.page = null;
  setPage({
    kicker, title: "Before dawn",
    paras,
    choices: [C("Morning", "morning", victim)],
  });
}

    if (offerer === S.killer && S.awareness >= 2) { die("nightcap"); return; }
    trustUp(offerer, 1);
    setPage({ kicker: `Day ${S.day}, evening`, title: "A nightcap", paras: [P(`It burns all the way down. You and ${G[offerer].name} talk for a while about nothing at all, and for a few minutes the house almost feels safe.`)], choices: [C("Go up", "night")] });
  } else {
    trustUp(offerer, -1);
    setPage({ kicker: `Day ${S.day}, evening`, title: "A nightcap", paras: [P(`${cap(G[offerer].name)} shrugs and drinks both. 'Suit yourself.' But the look stays with you all the way upstairs.`)], choices: [C("Go up", "night")] });
  }
};

A.lastEvening = () => setPage({
  kicker: "Day 4, evening", title: "The last evening",
  paras: [
    P("The storm is blowing itself out. Far across the water there's a light: Gorran's boat, sheltering on the mainland, waiting for calm to cross at dawn."),
    P("One more night. The killer knows it as well as you do."),
    P("Everyone is gathered in the great hall, because nobody will be anywhere alone. And they are all looking at you. You knew Edmund best. You knew this house. It's time to say what you know."),
  ],
  choices: [C("Stand up and name the killer", "accuseWho")],
});

A.accuseConfirm = () => setPage({
  kicker: `Day ${S.day}`, title: "Are you sure?",
  paras: [P("Once you've named someone, there's no taking it back. If you're wrong, the real killer will know exactly what you know, and there'll be nobody left to stop them.")],
  choices: [C("Yes. Gather everyone in the hall", "accuseWho"), C("Not yet", "hub", null, { back: true })],
});

A.accuseWho = () => setPage({
  kicker: "The great hall", title: "Who killed Sir Edmund?",
  paras: [P("You stand in front of the fire with your notebook in your hand. The room goes quiet.")],
  choices: aliveSuspects().map(id => C(G[id].full, "accuseHow", { who: id })),
});

A.accuseHow = ({ who }) => setPage({
  kicker: "The great hall", title: "How did they kill the others?",
  paras: [P(`Every eye turns to ${G[who].name}. You keep going.`)],
  choices: shuffle(SUSPECTS).map(m => C(METHODS[m], "accuseWhy", { who, how: m })),
});

A.accuseWhy = ({ who, how }) => setPage({
  kicker: "The great hall", title: "Why did they kill Edmund?",
  paras: [P("And then the part you're least sure of.")],
  choices: shuffle(SUSPECTS).map(m => C(MOTIVES[m], "verdict", { who, how, why: m })),
});

A.verdict = ({ who, how, why }) => {
  const k = S.killer;
  const innocents = aliveSuspects().filter(id => id !== k);
  const believed = innocents.length === 0 || innocents.reduce((n, id) => n + S.trust[id], 0) / innocents.length >= 2;
  if (who !== k) {
    ending("wrong", {
      title: "The wrong door",
      paras: [
        P(`They believe you. That's the worst of it. ${cap(G[who].full)} protests, then pleads, then goes very quiet, and they lock ${G[who].name} in the wine cellar with a candle and a blanket.`),
        P("You go to bed feeling almost safe for the first time in days."),
        P(`At three in the morning, your door handle turns. It's ${G[k].full}. They don't say anything. There's nothing left to say.`, "dead"),
        P("When Gorran's boat comes in at dawn, the police find a locked cellar, an innocent prisoner, and one more body than they were expecting."),
      ],
    });
    return;
  }
  const full = how === k && why === k;
  const paras = [
    P(`'${cap(G[k].full)},' you say. For a moment nobody moves. Then ${G[k].name} laughs, and the laugh goes on too long, and stops.`),
  ];
  if (!believed) paras.push(P("At first the others won't have it. You've been prying into rooms and asking questions for days; why should they believe you? It's only when you lay out every clue on the long table, one by one, that the room turns."));
  if (full) {
    paras.push(P(`You tell them how it was done: ${METHODS[k].toLowerCase()}. And why: ${MOTIVES[k].charAt(0).toLowerCase() + MOTIVES[k].slice(1)}. Every word lands. ${cap(G[k].name)} stops pretending.`));
    paras.push(P("They bind the killer's wrists with a curtain cord and sit up all night in a circle around them. In the grey dawn Gorran's boat comes in on a flat sea, and with it two policemen from Oban and a doctor who isn't afraid of anything."));
    paras.push(P("As the boat pulls away, you look back at the lodge. Someone has drawn all the curtains, so that for once, the house can't see you go."));
    ending("solved", { title: "The ledger closed", paras });
  } else {
    paras.push(P(`You have the right person, but not the whole story. ${!(how === k) ? "You've got the method wrong, and " : ""}${!(why === k) ? "you can't say why Edmund had to die, and " : ""}${cap(G[k].name)} sees the gap in it at once and goes straight for it.`));
    paras.push(P("It's enough. Just. They lock the killer in the cellar, and nobody sleeps. When the police come at dawn, the case against them is thin, and a clever barrister will spend a long time pulling at the loose threads. But you're alive to give evidence, and on Carrach that counts as winning."));
    ending("half", { title: "Half a confession", paras });
  }
};

function die(how) {
  const k = S.killer;
  const texts = {
    creep: {
      title: "A step on the stair",
      paras: [
        P("You're halfway down the back stairs when you realise you can hear breathing that isn't yours."),
        P("You never see their face. A hand in the dark, a shove, the long fall. In the morning they find you at the bottom of the stairs, and somebody says what a terrible accident, in this house, on these stairs.", "dead"),
      ],
    },
    watch: {
      title: "The long watch",
      paras: [
        P(`You sit up with ${G[k].name} by the fire, and you feel safe. That was always the idea.`),
        P(`You wake once, in the small hours, to find ${G[k].name} standing over you. They've known for a while what you know. They aren't smiling.`, "dead"),
      ],
    },
    nightcap: {
      title: "The last nightcap",
      paras: [
        P(`The whisky is good, and ${G[k].name} is kind, and for a moment you forget to be afraid.`),
        P("Then you taste it, under the peat smoke: bitter almonds. Your hands go numb first. The last thing you see is them, quite calm, taking the glass gently from your fingers before it can fall.", "dead"),
      ],
    },
  }[how];
  ending("dead", texts);
}

function ending(kind, { title, paras }) {
  S.ending = kind;
  const k = S.killer;
  const found = S.clues.filter(c => !c.key.startsWith("body:")).length;
  const missed = [];
  for (const [place, text] of Object.entries(K[k].clues)) if (!S.clues.some(c => c.key === `place:${place}`)) missed.push(`${PLACES[place].name}: ${text}`);
  if (!S.clues.some(c => c.key === "testimony")) missed.push(`${cap(G[K[k].testimony.by].full)}, if you'd earned their trust: ${K[k].testimony.text}`);
  if (!S.clues.some(c => c.key === "room")) missed.push(`${G[k].full}'s room: ${K[k].room}`);
  if (!S.clues.some(c => c.key === "slip")) missed.push(`Pressing ${G[k].name} hard: ${K[k].slip}`);
  if (!S.clues.some(c => c.key === "night")) missed.push(`Creeping through the house at night: ${K[k].night}`);
  if (!S.clues.some(c => c.key === "watch")) missed.push(`Sitting up with ${G[k].name}: ${K[k].watch}`);
  clearSave();
  S.page = {
    kicker: { solved: "You survived", half: "You survived", wrong: "The end", dead: "The end" }[kind], title,
    paras: [
      ...paras,
      P(`What really happened`, "heading"),
      P(K[k].truth),
      P(`It was ${G[k].full}. The others died by one method: ${METHODS[k].toLowerCase()}. You found ${found} of the ${8} clues that pointed to them.`),
      ...(missed.length ? [P("The clues you missed", "heading"), ...missed.map(m => P(m))] : []),
    ],
    choices: [C("Play again, with a different killer", "restart")],
  };
  render();
}

A.restart = () => { const name = S.name; S = null; clearSave(); showTitle(name); };

// ===== Drawing =====

const mainEl = document.getElementById("main");
const bar = document.getElementById("bar");

function render() {
  const p = S.page;
  bar.hidden = false;
  document.getElementById("when").innerHTML = S.day === 1 ? "The first evening"
    : `Day ${S.day} of 4${S.actions > 0 && !S.ending ? ` <span class="pips" aria-label="${S.actions} actions left">${"◆".repeat(S.actions)}${"◇".repeat(ACTIONS_PER_DAY[S.day] - S.actions)}</span>` : ""}`;
  const paras = p.paras.map(x => x.cls === "heading" ? `<p class="kicker" style="margin-top:2em">${x.text}</p>` : `<p${x.cls ? ` class="${x.cls}"` : ""}>${x.text}</p>`).join("");
  mainEl.innerHTML = `
    <p class="kicker">${p.kicker}</p>
    <h2>${p.title}</h2>
    <div class="story">${paras}</div>
    <div class="choices">${p.choices.map((c, i) => `<button data-i="${i}" class="${c.risky ? "risky" : ""} ${c.back ? "back" : ""}"><span>${c.label}${c.sub ? `<small>${c.sub}</small>` : ""}</span></button>`).join("")}</div>`;
  mainEl.querySelectorAll(".choices button").forEach(b => b.addEventListener("click", () => {
    const c = p.choices[Number(b.dataset.i)];
    A[c.action](c.arg);
    window.scrollTo({ top: 0 });
  }));
  renderBook();
}

function renderBook() {
  const clues = document.getElementById("bookClues"), people = document.getElementById("bookPeople");
  const items = [...S.clues.map(c => `<li>${c.text}<span class="where">${c.where}</span></li>`), ...S.notes.map(n => `<li>${n}<span class="where">What you've been told</span></li>`)];
  clues.innerHTML = items.length ? items.join("") : `<li class="empty">Nothing yet.</li>`;
  people.innerHTML = SUSPECTS.map(id => {
    const dead = !alive(id);
    const t = S.trust[id];
    const chip = dead ? `<span class="chip dead">Dead</span>` : `<span class="chip ${t >= 3 ? "warm" : t <= 0 ? "cold" : ""}">${TRUST_WORDS[t]}</span>`;
    return `<li><div class="who"><strong>${G[id].full}</strong>${chip}</div><span class="where">${LEDGER[id]}</span></li>`;
  }).join("") + `<li><div class="who"><strong>Hollis, the butler</strong>${alive("hollis") ? "" : `<span class="chip dead">Dead</span>`}</div></li>`;
}

const drawer = document.getElementById("drawer");
const setBook = open => { drawer.classList.toggle("open", open); drawer.setAttribute("aria-hidden", String(!open)); };
document.getElementById("openBook").addEventListener("click", () => setBook(true));
document.getElementById("closeBook").addEventListener("click", () => setBook(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") setBook(false); });

function showTitle(name = "") {
  bar.hidden = true;
  setBook(false);
  const saved = loadSave();
  mainEl.innerHTML = `
    <div class="title">
      <div class="over">Carrach · 1936</div>
      <h1>Baskerville Lodge</h1>
      <div class="sub">Murder Mystery</div>
      <div class="rule"></div>
      <p>A year ago, Sir Edmund Baskerville fell from the cliff path below his island lodge. Tonight, his guests are summoned back to hear a letter he left behind, and to learn that one of them pushed him.</p>
      <p>The boat won't return for three days. Search the house, win the others' trust, survive the nights, and name the killer before they silence you. Choose carefully: the killer is different every time you play.</p>
      <form id="startForm">
        <label for="playerName">You were Sir Edmund's secretary. What is your name?</label>
        <input id="playerName" maxlength="24" autocomplete="off" value="${esc(name)}" placeholder="Your name">
        <button class="btn" type="submit">Begin</button>
        ${saved && saved.page ? `<button class="btn" type="button" id="continue">Continue your game (day ${saved.day})</button>` : ""}
      </form>
      <p class="note">For adults. Contains murder, poisoning and dark themes.</p>
    </div>`;
  document.getElementById("startForm").addEventListener("submit", e => {
    e.preventDefault();
    const n = document.getElementById("playerName").value.trim() || "Lou";
    S = newState(n);
    A.boat();
  });
  document.getElementById("continue")?.addEventListener("click", () => { S = saved; render(); });
}

// ===== Rain =====

(function rain() {
  const cv = document.getElementById("rain");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d");
  let drops = [];
  const size = () => {
    cv.width = innerWidth; cv.height = innerHeight;
    drops = Array.from({ length: Math.round(innerWidth / 9) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, l: 10 + Math.random() * 18, v: 9 + Math.random() * 8 }));
  };
  size(); addEventListener("resize", size);
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = "rgba(170, 196, 204, .45)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l * 0.25, d.y + d.l);
      d.y += d.v; d.x -= d.v * 0.25;
      if (d.y > cv.height) { d.y = -20; d.x = Math.random() * (cv.width + 100); }
    }
    ctx.stroke();
    requestAnimationFrame(frame);
  })();
})();

// ===== Start =====

function start(data) {
  if (data && data.S && data.S.page) { S = data.S; render(); }
  else showTitle();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
