name: Daily riddle

on:
  schedule:
    # GitHub schedules use UTC. US Eastern time is 4 hours behind UTC in summer
    # and 5 in winter, so each time has two entries and the check below keeps
    # the right one: riddle at 11:47am, answer at 5:47pm. They're set 13 minutes early
    # because GitHub is busiest on the hour and often starts late.
    - cron: "47 15 * * *"
    - cron: "47 16 * * *"
    - cron: "47 21 * * *"
    - cron: "47 22 * * *"
  # Adds a "Run workflow" button on GitHub so you can send one straight away.
  workflow_dispatch:
    inputs:
      part:
        description: "Send the riddle or the answer?"
        type: choice
        options: [riddle, answer]
        default: riddle

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send today's riddle or answer
        working-directory: vestaboard
        env:
          VESTABOARD_API_KEY: ${{ secrets.VESTABOARD_API_KEY }}
          SONOS_CLIENT_ID: ${{ secrets.SONOS_CLIENT_ID }}
          SONOS_CLIENT_SECRET: ${{ secrets.SONOS_CLIENT_SECRET }}
          SONOS_REFRESH_TOKEN: ${{ secrets.SONOS_REFRESH_TOKEN }}
          SONOS_PLAYER_ID: ${{ secrets.SONOS_PLAYER_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          PART: ${{ inputs.part }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            eastern_offset=$(TZ=America/New_York date +%z)
            case "$SCHEDULE|$eastern_offset" in
              "47 15 * * *|-0400" | "47 16 * * *|-0500") PART=riddle ;;
              "47 21 * * *|-0400" | "47 22 * * *|-0500") PART=answer ;;
              *) exit 0 ;;
            esac
          fi
          if [ "$PART" = "answer" ]; then
            # Drum roll on the Sonos first, then the answer lands on the cymbal crash (3 seconds in).
            # If the sound fails, the answer still goes out straight away.
            if python3 ../sonos/sonos.py drumroll; then sleep 3; else echo "No drum roll this time."; fi
            python3 riddle.py --answer
          else
            # Thinking jingle on the Sonos first (about 7 seconds), then the riddle goes up.
            # If the sound fails, the riddle still goes out straight away.
            if python3 ../sonos/sonos.py thinking; then sleep 7; else echo "No thinking jingle this time."; fi
            python3 riddle.py
          fi
