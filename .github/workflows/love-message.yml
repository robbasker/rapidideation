name: Daily love message

on:
  schedule:
    # GitHub schedules use UTC, so run at both 7:00 and 8:00 UTC and let the
    # check below keep whichever one is 8am in London (it changes with summer time).
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  # Adds a "Run workflow" button on GitHub so you can send one straight away.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send today's message
        working-directory: vestaboard
        env:
          VESTABOARD_API_KEY: ${{ secrets.VESTABOARD_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            london_offset=$(TZ=Europe/London date +%z)
            if [ "$SCHEDULE" = "0 7 * * *" ] && [ "$london_offset" != "+0100" ]; then exit 0; fi
            if [ "$SCHEDULE" = "0 8 * * *" ] && [ "$london_offset" != "+0000" ]; then exit 0; fi
          fi
          python3 love_message.py
