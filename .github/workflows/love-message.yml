name: Daily love message

on:
  schedule:
    # GitHub schedules use UTC, so run at both 13:00 and 14:00 UTC and let the
    # check below keep whichever one is 9am US Eastern time (it changes with daylight saving).
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  # Adds a "Run workflow" button on GitHub so you can send one straight away.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send today's message
        working-directory: vestaboard
        env:
          VESTABOARD_API_KEY: ${{ secrets.VESTABOARD_API_KEY }}
          SONOS_CLIENT_ID: ${{ secrets.SONOS_CLIENT_ID }}
          SONOS_CLIENT_SECRET: ${{ secrets.SONOS_CLIENT_SECRET }}
          SONOS_REFRESH_TOKEN: ${{ secrets.SONOS_REFRESH_TOKEN }}
          SONOS_PLAYER_ID: ${{ secrets.SONOS_PLAYER_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            eastern_offset=$(TZ=America/New_York date +%z)
            if [ "$SCHEDULE" = "0 13 * * *" ] && [ "$eastern_offset" != "-0400" ]; then exit 0; fi
            if [ "$SCHEDULE" = "0 14 * * *" ] && [ "$eastern_offset" != "-0500" ]; then exit 0; fi
          fi
          # From Christmas Day to January 5, the 12 Days of Christmas take the place of the love message.
          if python3 christmas.py --in-season; then
            python3 christmas.py
          else
            python3 love_message.py
          fi
