name: Daily love message

on:
  # The daily schedule is switched off for now. To switch it back on, put these lines
  # back under "on:" (8:47am US Eastern, 13 minutes early because GitHub is busiest on
  # the hour and often starts late):
  #   schedule:
  #     - cron: "47 12 * * *"
  #     - cron: "47 13 * * *"
  # Adds a "Run workflow" button on GitHub so you can send one straight away.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send today's message
        working-directory: vestaboard
        env:
          VESTABOARD_API_KEY: ${{ secrets.VESTABOARD_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            eastern_offset=$(TZ=America/New_York date +%z)
            if [ "$SCHEDULE" = "47 12 * * *" ] && [ "$eastern_offset" != "-0400" ]; then exit 0; fi
            if [ "$SCHEDULE" = "47 13 * * *" ] && [ "$eastern_offset" != "-0500" ]; then exit 0; fi
          fi
          python3 love_message.py
